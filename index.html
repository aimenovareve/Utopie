<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utopie</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--soft:#8a8a8a;--line:#e6e6e6}
@media(prefers-color-scheme:dark){:root{--bg:#fff;--fg:#1a1a1a}}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--fg);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
nav{display:flex;gap:18px;justify-content:center;padding:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button,.btn{background:none;border:0;font:inherit;color:var(--soft);cursor:pointer;padding:4px 2px}
nav button.on{color:var(--fg);border-bottom:2px solid var(--fg)}
main{max-width:560px;margin:0 auto;padding:20px 16px 80px}
h2{font-weight:normal;font-size:1.5rem;margin:.2em 0}
.card{min-height:50vh}
.media img,.media video{max-width:100%;max-height:60vh;display:block;margin:0 auto 12px}
.media audio{width:100%;margin-bottom:12px}
.tags span{display:inline-block;margin:0 10px 6px 0;color:var(--soft);cursor:pointer}
.tags span.on{color:var(--fg);font-weight:bold}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0;align-items:center}
.bar .btn{border:1px solid var(--line);padding:6px 12px;border-radius:20px;color:var(--fg)}
.bar .btn.on{background:var(--fg);color:#fff}
.bar .next{margin-left:auto;border-color:var(--fg)}
input,textarea,select{width:100%;font:inherit;padding:9px;border:1px solid var(--line);margin:0 0 10px;background:#fff;color:var(--fg)}
button.main{background:var(--fg);color:#fff;border:0;padding:10px 18px;font:inherit;cursor:pointer}
.msg{color:#b00020;min-height:1.4em}
.c{border-top:1px solid var(--line);padding:8px 0}
.c b{font-weight:bold}
small{color:var(--soft)}
a{color:var(--fg)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const SB_URL='https://sfambkcrrqamleixpbai.supabase.co';
const SB_KEY='sb_publishable_XJ2w7ydorhN_vv__IlDZvA_EDGHyIaU';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null, tab='monde', queue=[], cur=null, active=new Set(), seen=new Set(), saved=new Set(), follows=new Set(), votes={};

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  me=session?.user||null;
  sb.auth.onAuthStateChange((_e,s)=>{me=s?.user||null});
  me?await boot():authView();
}
async function boot(){
  const [a,s,sv,f,v]=await Promise.all([
    sb.from('active_hashtags').select('tag'),sb.from('seen').select('creation_id'),
    sb.from('saves').select('creation_id'),sb.from('follows').select('followed_id'),
    sb.from('votes').select('creation_id,value')]);
  active=new Set((a.data||[]).map(x=>x.tag));seen=new Set((s.data||[]).map(x=>x.creation_id));
  saved=new Set((sv.data||[]).map(x=>x.creation_id));follows=new Set((f.data||[]).map(x=>x.followed_id));
  votes={};(v.data||[]).forEach(x=>votes[x.creation_id]=x.value);
  go('monde');
}
function nav(){
  $('#nav').innerHTML=me?['monde:Le monde','chambre:Ma chambre','publier:Publier','chercher:Chercher','moi:Moi']
    .map(t=>{const[k,l]=t.split(':');return `<button class="${tab===k?'on':''}" data-k="${k}">${l}</button>`}).join(''):'';
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function go(k){tab=k;nav();({monde:feed,chambre:feed,publier:publish,chercher:search,moi:profile})[k]()}

function authView(){
  nav();
  app.innerHTML=`<h2>Utopie</h2><p><small>Un réseau où personne ne compte rien.</small></p>
  <input id="u" placeholder="Pseudo (pour s'inscrire)"><input id="e" type="email" placeholder="Email">
  <input id="p" type="password" placeholder="Mot de passe (6 caractères min.)">
  <p class="msg" id="m"></p><button class="main" id="in">Se connecter</button> <button class="btn" id="up">Créer un compte</button>`;
  $('#in').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#e').value,password:$('#p').value});
    if(error)return $('#m').textContent=error.message;const{data:{session}}=await sb.auth.getSession();me=session.user;boot()};
  $('#up').onclick=async()=>{const u=$('#u').value.trim();if(u.length<3)return $('#m').textContent='Choisis un pseudo de 3 caractères minimum.';
    const{data,error}=await sb.auth.signUp({email:$('#e').value,password:$('#p').value,options:{data:{username:u}}});
    if(error)return $('#m').textContent=error.message;
    if(!data.session)return $('#m').textContent='Compte créé. Confirme ton email puis connecte-toi.';
    me=data.user;boot()};
}

/* ---------- Feed ---------- */
async function loadQueue(){
  let q=sb.from('creations').select('*,profiles(username)').order('created_at',{ascending:false}).limit(300);
  if(tab==='monde')q=q.eq('is_recommended',true).neq('author_id',me.id);
  else{if(!follows.size)return[];q=q.in('author_id',[...follows])}
  const{data}=await q;
  let list=(data||[]).filter(c=>!seen.has(c.id));
  if(tab==='monde')list.forEach(c=>c._s=(c.hashtags||[]).filter(t=>active.has(t)).length*10+Math.random());
  else list.forEach(c=>c._s=-new Date(c.created_at).getTime());
  return list.sort((a,b)=>b._s-a._s);
}
async function feed(){
  app.innerHTML='<p><small>Chargement…</small></p>';
  queue=await loadQueue();next();
}
async function next(){
  cur=queue.shift();
  if(!cur){app.innerHTML=tab==='monde'?'<h2>Tu as tout vu pour l\'instant.</h2><p><small>Reviens plus tard, ou publie la tienne.</small></p>'
    :'<h2>Ma chambre est vide.</h2><p><small>Suis des comptes depuis « Chercher » ou depuis une créa.</small></p>';return}
  seen.add(cur.id);sb.from('seen').upsert({user_id:me.id,creation_id:cur.id});
  render();
}
function mediaHtml(c){
  return (c.media_urls||[]).map(u=>{const x=u.split('?')[0].toLowerCase();
    if(/\.(mp3|wav|ogg|m4a|aac|flac)$/.test(x))return `<audio controls src="${esc(u)}"></audio>`;
    if(/\.(mp4|webm|mov)$/.test(x))return `<video controls playsinline src="${esc(u)}"></video>`;
    return `<img src="${esc(u)}" alt="">`}).join('');
}
function render(){
  const c=cur,v=votes[c.id];
  app.innerHTML=`<div class="card"><div class="media">${mediaHtml(c)}</div>
  ${c.title?`<h2>${esc(c.title)}</h2>`:''}${c.body?`<p>${esc(c.body)}</p>`:''}
  ${c.link_url?`<p><a href="${esc(c.link_url)}" target="_blank" rel="noopener noreferrer">${esc(c.link_url)}</a></p>`:''}
  <div class="tags">${(c.hashtags||[]).map(t=>`<span data-t="${esc(t)}" class="${active.has(t)?'on':''}">#${esc(t)}</span>`).join('')}</div>
  <p><small>${esc(c.kind)} · ${esc(c.profiles?.username||'')}</small>
  ${c.author_id!==me.id?`<button class="btn" id="fl">${follows.has(c.author_id)?'Ne plus suivre':'Suivre'}</button>`:''}</p>
  <div class="bar"><button class="btn ${v===1?'on':''}" id="up">Upvote</button><button class="btn ${v===-1?'on':''}" id="dn">Downvote</button>
  <button class="btn ${saved.has(c.id)?'on':''}" id="sv">Enregistrer</button><button class="btn" id="cm">Commenter</button>
  <button class="btn next" id="nx">Suivant</button></div><div id="cbox"></div></div>`;
  document.querySelectorAll('.tags span').forEach(s=>s.onclick=()=>toggleTag(s.dataset.t));
  $('#up').onclick=()=>vote(1);$('#dn').onclick=()=>vote(-1);$('#nx').onclick=next;
  $('#sv').onclick=async()=>{saved.has(c.id)?(saved.delete(c.id),await sb.from('saves').delete().match({user_id:me.id,creation_id:c.id})):
    (saved.add(c.id),await sb.from('saves').insert({user_id:me.id,creation_id:c.id}));render()};
  $('#cm').onclick=comments;
  if($('#fl'))$('#fl').onclick=()=>toggleFollow(c.author_id,render);
}
async function vote(val){
  const c=cur;
  if(votes[c.id]===val){delete votes[c.id];await sb.from('votes').delete().match({user_id:me.id,creation_id:c.id})}
  else{votes[c.id]=val;await sb.from('votes').upsert({user_id:me.id,creation_id:c.id,value:val})}
  render();
}
async function toggleTag(t){
  active.has(t)?(active.delete(t),await sb.from('active_hashtags').delete().match({user_id:me.id,tag:t})):
    (active.add(t),await sb.from('active_hashtags').insert({user_id:me.id,tag:t}));
  if(cur)render();
}
async function toggleFollow(id,cb){
  follows.has(id)?(follows.delete(id),await sb.from('follows').delete().match({follower_id:me.id,followed_id:id})):
    (follows.add(id),await sb.from('follows').insert({follower_id:me.id,followed_id:id}));cb&&cb();
}
async function comments(){
  const{data}=await sb.from('comments').select('body,created_at,profiles(username)').eq('creation_id',cur.id).order('created_at');
  $('#cbox').innerHTML=(data||[]).map(c=>`<div class="c"><b>${esc(c.profiles?.username)}</b> ${esc(c.body)}</div>`).join('')+
    `<textarea id="ct" rows="2" placeholder="Ton commentaire"></textarea><p class="msg" id="cmsg"></p><button class="main" id="cs">Envoyer</button>`;
  $('#cs').onclick=async()=>{const b=$('#ct').value.trim();if(!b)return;
    const{error}=await sb.from('comments').insert({creation_id:cur.id,author_id:me.id,body:b});
    error?$('#cmsg').textContent=error.message.includes('Limite')?'Tu as déjà posté 5 commentaires ici.':error.message:comments()};
}

/* ---------- Publier ---------- */
function publish(){
  app.innerHTML=`<h2>Publier une créa</h2>
  <select id="k">${['photo','video','musique','mode','mannequin','produit','texte','annonce'].map(k=>`<option>${k}</option>`).join('')}</select>
  <input id="t" placeholder="Titre (optionnel)"><textarea id="b" rows="3" placeholder="Texte (optionnel)"></textarea>
  <input id="l" placeholder="Lien YouTube, Spotify, Insta… (optionnel)">
  <input id="h" placeholder="Hashtags séparés par des espaces (10 max), ex : paris musique">
  <input id="f" type="file" multiple accept="image/*,audio/*,video/*">
  <label><input type="checkbox" id="m" style="width:auto"> Ne pas montrer aux mineurs</label>
  <p class="msg" id="pm"></p><button class="main" id="ps">Publier</button>`;
  $('#ps').onclick=async()=>{
    const msg=$('#pm');msg.textContent='';
    const tags=[...new Set($('#h').value.toLowerCase().split(/[\s,#]+/).filter(Boolean))];
    if(tags.length>10)return msg.textContent='10 hashtags maximum.';
    const files=[...$('#f').files];
    if(!files.length&&!$('#b').value.trim()&&!$('#l').value.trim()&&!$('#t').value.trim())return msg.textContent='Ajoute au moins un fichier, un texte ou un lien.';
    $('#ps').disabled=true;msg.textContent='Envoi en cours…';
    const urls=[];
    for(const f of files){
      const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
      const path=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const{error}=await sb.storage.from('creations').upload(path,f);
      if(error){$('#ps').disabled=false;return msg.textContent='Fichier refusé : '+error.message}
      urls.push(sb.storage.from('creations').getPublicUrl(path).data.publicUrl);
    }
    const{error}=await sb.from('creations').insert({author_id:me.id,kind:$('#k').value,title:$('#t').value||null,body:$('#b').value||null,
      link_url:$('#l').value||null,media_urls:urls,hashtags:tags,hide_from_minors:$('#m').checked});
    $('#ps').disabled=false;
    if(error)return msg.textContent=error.message.includes('Limite')?'Tu as atteint 5 publications aujourd\'hui.':error.message;
    msg.style.color='#1a1a1a';msg.textContent='Publié.';setTimeout(()=>go('monde'),700);
  };
}

/* ---------- Chercher ---------- */
function search(){
  app.innerHTML=`<h2>Chercher</h2><input id="q" placeholder="Un pseudo, ou un hashtag à activer"><div id="res"></div>
  <h2 style="font-size:1.1rem">Mes hashtags activés</h2><div class="tags" id="act"></div>`;
  const drawAct=()=>{$('#act').innerHTML=[...active].map(t=>`<span class="on" data-t="${esc(t)}">#${esc(t)}</span>`).join('')||'<small>Aucun pour l\'instant.</small>';
    document.querySelectorAll('#act span').forEach(s=>s.onclick=async()=>{await toggleTag(s.dataset.t);drawAct()})};
  drawAct();
  $('#q').oninput=async e=>{
    const v=e.target.value.trim().replace(/^[#@]/,'').toLowerCase();if(v.length<2)return $('#res').innerHTML='';
    const{data}=await sb.from('profiles').select('id,username').ilike('username',`%${v}%`).neq('id',me.id).limit(10);
    $('#res').innerHTML=`<div class="row"><span>#${esc(v)}</span><button class="btn" id="ah">${active.has(v)?'Désactiver':'Activer'}</button></div>`+
      (data||[]).map(p=>`<div class="row"><span>${esc(p.username)}</span><button class="btn" data-f="${p.id}">${follows.has(p.id)?'Ne plus suivre':'Suivre'}</button></div>`).join('');
    $('#ah').onclick=async()=>{await toggleTag(v);drawAct();$('#ah').textContent=active.has(v)?'Désactiver':'Activer'};
    document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>toggleFollow(b.dataset.f,()=>{b.textContent=follows.has(b.dataset.f)?'Ne plus suivre':'Suivre'}));
  };
}

/* ---------- Moi ---------- */
async function profile(){
  const{data:p}=await sb.from('profiles').select('username,bio,location_tag').eq('id',me.id).single();
  const{data:mine}=await sb.from('creations').select('id,title,kind,media_urls,created_at').eq('author_id',me.id).order('created_at',{ascending:false});
  app.innerHTML=`<h2>${esc(p?.username)}</h2>
  <textarea id="bio" rows="2" placeholder="Ta bio">${esc(p?.bio||'')}</textarea>
  <input id="loc" placeholder="Ta ville ou région (optionnel, jamais une adresse)" value="${esc(p?.location_tag||'')}">
  <button class="main" id="sp">Enregistrer</button> <button class="btn" id="lo">Se déconnecter</button><p class="msg" id="pm"></p>
  <h2 style="font-size:1.1rem">Mes créas</h2>${(mine||[]).map(c=>`<div class="row"><span>${esc(c.title||c.kind)}</span><button class="btn" data-d="${c.id}">Supprimer</button></div>`).join('')||'<small>Rien publié pour l\'instant.</small>'}`;
  $('#sp').onclick=async()=>{await sb.from('profiles').update({bio:$('#bio').value,location_tag:$('#loc').value}).eq('id',me.id);$('#pm').style.color='#1a1a1a';$('#pm').textContent='Enregistré.'};
  $('#lo').onclick=async()=>{await sb.auth.signOut();me=null;authView()};
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Supprimer cette créa ?')){await sb.from('creations').delete().eq('id',b.dataset.d);profile()}});
}

/* swipe + clavier */
let x0=null;
document.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{if(x0===null||!cur||!(tab==='monde'||tab==='chambre'))return;
  const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-70&&!/INPUT|TEXTAREA|AUDIO|VIDEO/.test(document.activeElement.tagName))next()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&(tab==='monde'||tab==='chambre'))next()});
init();
</script>
</body>
</html>
